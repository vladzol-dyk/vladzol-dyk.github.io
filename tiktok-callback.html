<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content OS Publisher — TikTok sign-in</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; line-height: 1.6; color: #1d1d1f; }
  textarea { width: 100%; height: 120px; font-family: ui-monospace, monospace; font-size: 13px; }
  button { margin-top: 12px; padding: 10px 18px; font-size: 16px; }
</style>
</head>
<body>
<h1>TikTok sign-in</h1>
<p id="msg">Copy the text below and paste it to Claude.</p>
<textarea id="addr" readonly></textarea>
<button onclick="navigator.clipboard.writeText(document.getElementById('addr').value);this.textContent='Copied ✓'">Copy</button>
<p><a href="privacy.html">Privacy policy</a> · <a href="terms.html">Terms of service</a></p>
<script>
  document.getElementById('addr').value = window.location.href;
  if (new URLSearchParams(window.location.search).get('error')) {
    document.getElementById('msg').textContent = 'TikTok returned an error. Copy this and send it to Claude anyway.';
  }
</script>
</body>
</html>
